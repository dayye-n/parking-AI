version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: parksense_postgres
    environment:
      POSTGRES_USER: parksense_user
      POSTGRES_PASSWORD: parksense_pass
      POSTGRES_DB: parksense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parksense_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

